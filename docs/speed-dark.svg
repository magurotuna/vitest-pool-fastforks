<title>Speed-up over the forks pool</title>
<desc>readest: 2.47× with 16 vCPUs, 2.13× with 4 vCPUs. Vuetify: 1.59× with 16 vCPUs, 2.24× with 4 vCPUs. Material UI: 1.48× with 16 vCPUs, 2.01× with 4 vCPUs. Base UI: 1.42× with 16 vCPUs, 1.48× with 4 vCPUs. MUI X: 1.37× with 16 vCPUs, 1.61× with 4 vCPUs. Vitest (test/unit): 1.18× with 16 vCPUs, 1.69× with 4 vCPUs. Instructure UI: 1.04× with 16 vCPUs, 0.96× with 4 vCPUs. All 7 projects: 1.66× with 16 vCPUs, 1.70× with 4 vCPUs.</desc>
