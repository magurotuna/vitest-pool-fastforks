name: prebuild

# Builds the native addon on each platform, runs the fixture comparisons with
# the prebuilt addon, and packs the package with every prebuilt addon.
# Each run uses Actions minutes (macOS counts 10 times, Windows 2 times), so
# it runs only by hand or for a version tag.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'all, or some of: glibc, musl, macos, windows'
        default: all
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a run: it can be publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26.13.0

jobs:
  # Built in a manylinux_2_28 container: the addon then loads on Linux with
  # glibc 2.28 or later, which is also what Node.js 26 needs.
  glibc:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'glibc')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
            arch: x64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:js
      - run: npm run build
      - run: npm run copy-prebuild
      - run: npm test -- --out results
      - run: node test/watch.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds-linux-${{ matrix.arch }}-glibc
          path: prebuilds

  # GitHub Actions cannot run JavaScript actions in an Alpine container, so
  # the build and the tests run in `docker run`.
  musl:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'musl')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/w" -w /w "node:${NODE_VERSION}-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216" sh -c
          'apk add --no-cache build-base python3 git &&
          node --version && npm ci && npm run build:js && npm run build && npm run copy-prebuild &&
          npm test -- --out results && node test/watch.mjs'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds-linux-${{ matrix.arch }}-musl
          path: prebuilds

  # One arm64 runner builds both architectures. The x64 addon is
  # cross-compiled and is not tested.
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:js
      - run: npm run build
      - run: npm run copy-prebuild
      - run: npm test -- --out results
      - run: node test/watch.mjs
      - run: npx node-gyp rebuild --arch=x64
      - run: npm run copy-prebuild -- x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds-darwin
          path: prebuilds

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:js
      - run: npm run build
      - run: npm run copy-prebuild
      - run: npm test -- --out results
      - run: node test/watch.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds-win32-x64
          path: prebuilds

  # Packs the package with the prebuilt addons of the jobs that ran, and
  # checks that it installs and runs without a compiler.
  package:
    needs: [glibc, musl, macos, windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds
      - run: find prebuilds -type f | sort
      - run: npm ci
      # prepack builds dist.
      - run: npm pack
      - run: bash test/install-check.sh vitest-pool-fastforks-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: vitest-pool-fastforks-*.tgz

  # Publishes the package that the package job tested, for a version tag
  # only, and only after every platform passed. npm trusted publishing
  # (OpenID Connect) needs no token and adds provenance. The npm environment
  # can require an approval before this job runs.
  publish:
    needs: [glibc, musl, macos, windows, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Check that the tag is the package version
        run: |
          version=$(tar -xOzf vitest-pool-fastforks-*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME is not the package version v$version" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public vitest-pool-fastforks-*.tgz
