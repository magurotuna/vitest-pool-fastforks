name: test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Actions minutes of a private repository are limited (macOS counts 10 times,
# Windows 2 times). A push runs only Linux; run the workflow by hand
# (workflow_dispatch) for macOS, Windows, other Vitest versions, and Node 24.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, lint, type check, and unit tests, also for the C++ addon.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      # The same version as clang-tools in flake.lock.
      - run: pipx run clang-format==21.1.8 --dry-run --Werror addon/fastforks.cc
      # Node.js builds addons with -Wall -Wextra. Fail on a warning in the
      # addon's own code only: the Node.js headers can have warnings too.
      - name: Build the addon without warnings in addon/
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          if grep -E 'addon/[^:]+:[0-9]+:[0-9]+: warning:' build.log; then exit 1; fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - run: npm ci
      - run: npm run build:js
      - run: npm run build
      - run: npm test -- --out results
      - run: node test/watch.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.os }}
          path: results

  # The other Vitest versions that the real projects use.
  vitest-versions:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        vitest: [4.0.15, 5.0.5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - run: npm ci
      - run: npm run build:js
      # Other Vitest versions on purpose, outside the lockfile. The vite-plus
      # dev dependency needs the Vitest version of the lockfile, so npm must
      # ignore the peer dependencies. Then npm also removes vite, a peer
      # dependency of Vitest 5: install the vite version of the lockfile.
      - run: | # zizmor: ignore[adhoc-packages]
          vite=$(node -p "require('./node_modules/vite/package.json').version")
          npm install --no-save --legacy-peer-deps "vitest@$VERSION" "@vitest/coverage-v8@$VERSION" "@vitest/coverage-istanbul@$VERSION" "vite@$vite"
        env:
          VERSION: ${{ matrix.vitest }}
      - run: npm run build
      - run: npm test -- --out results
      - run: node test/watch.mjs

  # On a Node.js that is too old, the pool prints a warning and uses forks.
  fallback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:js
      - run: npm test -- --out results basic exit
        env:
          FASTFORKS_FALLBACK: forks
      - run: grep -q 'Using the "forks" pool instead' results/basic/fastforks.stderr
